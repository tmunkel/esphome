output:                                                      # Hardware output definitions
  - platform: ledc                                           # Use ESP32 LEDC hardware PWM controller
    pin: 2                                                   # GPIO 2 controls the display backlight
    frequency: 1220                                          # 1220 Hz PWM frequency prevents flickering
    id: gpio_backlight_pwm                                   # Internal ID to link with light component

light:
  - platform: monochromatic
    output: gpio_backlight_pwm
    name: Display Backlight
    id: back_light
    restore_mode: ALWAYS_OFF
    default_transition_length: 0s

    on_state:
      then:
        - lambda: |-
            const bool target_on = id(led_switch) > 0;
            const float target_brightness = id(led_switch) / 100.0f;
            const auto &actual = id(back_light).remote_values;
  
            if (actual.is_on() == target_on &&
                (!target_on ||
                 fabsf(actual.get_brightness() - target_brightness) < 0.0001f)) {
              return;
            }
  
            id(backlight_internal_update) = true;
  
            auto call = id(back_light).make_call();
            call.set_state(target_on);
            if (target_on) {
              call.set_brightness(target_brightness);
            }
            call.set_transition_length(0);
            call.set_save(false);
            call.perform();
  
            id(backlight_internal_update) = false;
globals:
  - id: led_switch
    type: int
    restore_value: no
    initial_value: '0'

  - id: backlight_internal_update
    type: bool
    restore_value: no
    initial_value: 'false'

  - id: countdown_start_level
    type: int
    restore_value: no
    initial_value: '0'
    
  - id: light_icon_on
    type: bool
    restore_value: no
    initial_value: 'false'

binary_sensor:
  - platform: gpio
    pin:
      number: GPIO38
      mode: INPUT
    name: "Motion Sensor"
    id: motion_sensor
    device_class: motion
    trigger_on_initial_state: true

    on_press:
      then:
        - script.stop: motion_countdown
        - globals.set:
            id: led_switch
            value: '100'

    on_release:
      then:
        - if:
            condition:
              lambda: 'return id(led_switch) > 0;'
            then:
              - script.execute: motion_countdown

script:
  - id: motion_countdown
    mode: restart
    then:
      - lambda: |-
          id(countdown_start_level) = id(led_switch);
      - delay: 60s
      - repeat:
          count: 100
          then:
            - delay: 600ms
            - lambda: |-
                // Round upward so zero occurs only at the final step.
                id(led_switch) =
                    (id(countdown_start_level) * (99 - iteration) + 99) / 100;

